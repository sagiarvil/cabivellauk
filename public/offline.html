<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Offline | Cabivella UK Architectural Cabinetry</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #182320;
      color: #f8f6f1;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
    }
    .offline-box {
      max-width: 500px;
      padding: 40px 24px;
    }
    .crest {
      width: 72px;
      height: 72px;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 26px;
      letter-spacing: 0.08em;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #afbfb4;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #dec4a5;
      color: #182320;
      padding: 12px 24px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>
  <div class="offline-box">
    <img src="/assets/img/cabivella-crest-transparent.webp" alt="Cabivella" class="crest">
    <h1>YOU ARE CURRENTLY OFFLINE</h1>
    <p>Please check your internet connection. Cabivella specification files and cached collections will automatically refresh once network access is restored.</p>
    <a href="/" class="btn" onclick="window.location.reload(); return false;">Retry Connection</a>
  </div>
</body>
</html>
