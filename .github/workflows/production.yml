name: Cloudflare Pages Production Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Astro static site
        run: npm run build
        env:
          PUBLIC_SITE_URL: https://cabivella.co.uk
          LEAD_NOTIFICATION_EMAIL: barisbagirlar@gmail.com
          WHATSAPP_NUMBER: "+447898262110"
          LINKEDIN_URL: https://www.linkedin.com/in/barisbagirlar/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=cabivella-uk
