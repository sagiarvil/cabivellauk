name: CI Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Astro type check
        run: npx astro check

      - name: Build static production site
        run: npm run build

      - name: Run SEO audit script
        run: npm run audit:seo

      - name: Run asset rights audit
        run: npm run audit:assets

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright acceptance tests
        run: npm run test
